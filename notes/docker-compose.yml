name: notes
services:
  dumbpad:
    image: dumbwareio/dumbpad:latest
    container_name: dumbpad
    restart: unless-stopped
    ports:
      - 11000:3000
    volumes:
      - ${DOCKER_DIR}/dumbpad/data:/app/data
    environment:
      SITE_TITLE: ${DUMBPAD_SITE_TITLE}
      DUMBPAD_PIN: ${DUMBPAD_PIN}
      BASE_URL: ${DUMBPAD_BASE_URL}

  ignis:
    image: nobbe/ignis:latest
    container_name: ignis
    ports:
      - 11001:8080
    environment:
      - OBSIDIAN_VERSION=1.12.7
      - PUID=1000
      - PGID=1000
    volumes:
      - ${DATA_DIR}/files/obsidian-vaults:/vaults
      - ${DOCKER_DIR}/ignis/data:/app/data
      - ${DOCKER_DIR}/ignis/obsidian-app:/app/obsidian-app
    restart: unless-stopped

  zennotes:
    image: "adibhanna/zennotes:latest"
    container_name: zennotes
    user: 1000:1000
    ports:
      - 11002:7878
    environment:
      - ZENNOTES_AUTH_TOKEN=${ZENNOTES_AUTH_TOKEN}
      - ZENNOTES_BEHIND_TLS=${ZENNOTES_BEHIND_TLS}
    volumes:
      - ${DOCKER_DIR}/zennotes/data:/data
      - ${DATA_DIR}/zennotes-workspace:/workspace
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    read_only: true
