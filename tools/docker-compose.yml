name: tools
services:
  # NextExlorer
  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    restart: unless-stopped
    ports:
      - 10000:3000
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=https://nextexplorer.herbatka-test.duckdns.org
      - UID=${PUID}
      - GID=${PGID}
    volumes:
      - ${DOCKER_DIR}/nextexplorer/config:/config
      - ${DOCKER_DIR}/nextexplorer/cache:/cache
      - ${HOME_DIR}:/mnt/Home
      - ${HDD_DIR}:/mnt/HDD

  # Termix
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - 10001:8080
    volumes:
      - termix-data:/app/data
    environment:
      - PORT=8080
      - PUID=${PUID}
      - PGID=${PGID}

  # IT Tools
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    hostname: it-tools
    ports:
      - 10003:80

  # PDF Tools
  bentopdf:
    image: bentopdf/bentopdf-simple:latest
    container_name: bentopdf
    ports:
      - 10004:8080
    restart: unless-stopped

  # Diagram tools
  excalidraw:
    container_name: excalidraw
    image: excalidraw/excalidraw:latest
    ports:
      - 10006:80
    restart: unless-stopped

volumes:
  termix-data:
    driver: local
